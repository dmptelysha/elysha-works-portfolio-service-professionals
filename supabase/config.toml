project_id = "elysha-works-portfolio"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "https://elyshaworks.com"
additional_redirect_urls = ["https://www.elyshaworks.com", "http://localhost:3000", "http://127.0.0.1:3000"]
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Your Elysha Works verification code"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.confirmation]
subject = "Your Elysha Works verification code"
content_path = "./supabase/templates/confirmation.html"

[auth.captcha]
enabled = true
provider = "turnstile"
secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

# The browser-owned finalization endpoint relies on the Supabase gateway JWT
# check and repeats ownership validation with the caller's bearer token.
[functions.finalize-proposal]
verify_jwt = true

[functions.request-email-otp]
verify_jwt = true

[functions.verify-email-otp]
verify_jwt = true

# These public/server-to-server endpoints implement their own proposal-key,
# signed-token, or shared-secret authentication and therefore cannot require a
# visitor JWT at the gateway.
[functions.verify-proposal]
verify_jwt = false

[functions.make-proposal-followups]
verify_jwt = false

[functions.stop-proposal-followups]
verify_jwt = false
